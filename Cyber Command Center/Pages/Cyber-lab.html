        <main class="cyber-lab-page">
            <section class="lab-shell">
                <div class="lab-toolbar">
                    <div class="lang-tabs" role="tablist" aria-label="Langages de programmation">
                        <button class="lang-btn active" type="button" data-lang="bash" aria-pressed="true">Bash</button>
                        <button class="lang-btn" type="button" data-lang="python" aria-pressed="false">Python</button>
                        <button class="lang-btn" type="button" data-lang="c" aria-pressed="false">C</button>
                    </div>

                    <div class="window-controls" aria-label="Contrôles de fenêtre">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>
                    </div>
                </div>

                <div class="lab-body">
                    <aside class="workspace-panel">
                        <div class="panel-header">
                            <span>Workspace</span>
                        </div>

                        <ul class="file-list">
                            <li class="active">main.sh</li>
                            <li>script.py</li>
                            <li>main.c</li>
                            <li>notes.txt</li>
                        </ul>

                        <div class="stats-panel">
                            <div class="mini-stat">
                                <span class="mini-label">Status</span>
                                <strong>online</strong>
                            </div>
                            <div class="mini-stat">
                                <span class="mini-label">Kernel</span>
                                <strong>6.8.0</strong>
                            </div>
                        </div>
                    </aside>

                    <section class="editor-panel">
                        <div class="editor-header">
                            <span id="file-name">main.sh</span>
                            <button type="button" class="run-btn">Run</button>
                        </div>

                        <textarea id="code-editor" spellcheck="false" aria-label="Éditeur de code"></textarea>
                    </section>

                    <aside class="terminal-panel">
                        <div class="terminal-header">
                            <span>Terminal</span>
                            <span class="status-pill">ready</span>
                        </div>

                        <pre id="terminal-output" aria-live="polite">$ ./terminal --status
[system] ready for execution
[lab] waiting for input</pre>
                    </aside>
                </div>
            </section>
        </main>

        <script>
            const snippets = {
                bash: `#!/bin/bash\n\necho "[INFO] Initialisation du terminal..."\nls -l\npwd\nwhoami\n`,
                python: `print("[INFO] Démarrage du script Python")\nprint("Analyse des données en cours...")\nprint("Resultat: 42")\n`,
                c: `#include <stdio.h>\n\nint main() {\n    printf("[INFO] Compilation du programme C\n");\n    printf("Resultat: 42\\n");\n    return 0;\n}\n`
            };

            const fileNames = {
                bash: 'main.sh',
                python: 'script.py',
                c: 'main.c'
            };

            const editor = document.getElementById('code-editor');
            const terminalOutput = document.getElementById('terminal-output');
            const fileNameLabel = document.getElementById('file-name');
            const langButtons = document.querySelectorAll('.lang-btn');
            const runButton = document.querySelector('.run-btn');

            function updateEditor(language) {
                editor.value = snippets[language];
                fileNameLabel.textContent = fileNames[language];
                document.querySelectorAll('.file-list li').forEach((item, index) => {
                    const activeLanguage = language === 'bash' ? 0 : language === 'python' ? 1 : 2;
                    item.classList.toggle('active', index === activeLanguage);
                });
            }

            function escapeTerminalText(value) {
                return value.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function runBash(code) {
                const output = [];

                if (code.includes('echo')) {
                    const match = code.match(/echo\s+["']?(.+?)["']?$/m);
                    if (match) output.push(match[1]);
                }

                if (code.includes('ls')) output.push('bin  dev  etc  home  root  usr  var');
                if (code.includes('pwd')) output.push('/home/elie/projects/cyber-lab');
                if (code.includes('whoami')) output.push('elie');
                if (code.includes('uname')) output.push('Linux 6.8.0');

                if (!output.length) output.push('[bash] command executed successfully');

                return `$ bash ${fileNames.bash}\n${output.join('\n')}`;
            }

            function runPython(code) {
                const output = [];
                const printMatches = [...code.matchAll(/print\(\s*["']([^"']+)["']\s*\)/g)];

                if (printMatches.length) {
                    printMatches.forEach((match) => output.push(match[1]));
                } else if (code.includes('print')) {
                    output.push('[python] execution successful');
                }

                if (!output.length) output.push('[python] script executed without output');

                return `$ python3 ${fileNames.python}\n${output.join('\n')}`;
            }

            function runC(code) {
                const output = [];

                if (code.includes('#include <stdio.h>')) {
                    const printMatches = [...code.matchAll(/printf\(\s*["']([^"']+)["']\s*\)/g)];

                    if (printMatches.length) {
                        printMatches.forEach((match) => output.push(match[1].replace('\\n', '')));
                    } else {
                        output.push('[c] compilation successful');
                    }
                } else {
                    output.push('[c] invalid C source');
                }

                return `$ gcc ${fileNames.c} -o lab && ./lab\n${output.join('\n')}`;
            }

            function runCode() {
                const selectedLanguage = document.querySelector('.lang-btn.active')?.dataset.lang || 'bash';
                const code = editor.value.trim();

                let result = '$ system ready\n';

                if (!code) {
                    result = '$ system ready\n[error] empty script';
                } else if (selectedLanguage === 'bash') {
                    result = runBash(code);
                } else if (selectedLanguage === 'python') {
                    result = runPython(code);
                } else if (selectedLanguage === 'c') {
                    result = runC(code);
                }

                terminalOutput.textContent = result;
            }

            langButtons.forEach((button) => {
                button.addEventListener('click', () => {
                    const language = button.dataset.lang;
                    langButtons.forEach((item) => {
                        const active = item === button;
                        item.classList.toggle('active', active);
                        item.setAttribute('aria-pressed', String(active));
                    });
                    updateEditor(language);
                });
            });

            runButton.addEventListener('click', runCode);
            updateEditor('bash');
        </script>
    </body>
</html>
